services:
  - type: web
    name: zebpomo-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: ALLOWED_ORIGIN
        value: https://mdshazeb9963-code.github.io
